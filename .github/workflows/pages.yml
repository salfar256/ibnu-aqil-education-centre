name: Publish public website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install PHP for application tests
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, gd, intl
          tools: composer:v2
          coverage: none
      - name: Install test dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader
      - name: Test original framework dependencies on Linux
        env:
          APP_ENV: testing
          APP_URL: http://localhost
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Install PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, gd, intl
          tools: composer:v2
          coverage: none
      - name: Install application dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - name: Prepare public content database
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_URL: ${{ steps.pages.outputs.base_url }}
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --seed --force
          php artisan app:export-public --url="$APP_URL" --output=pages --portal-url="$PORTAL_URL"
      - name: Upload only static public output
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
