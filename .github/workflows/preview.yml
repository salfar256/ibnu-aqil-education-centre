name: Preview tampilan (cabang selain main)

# Menjalankan tes dan membuat ekspor statis untuk cabang kerja, lalu menyimpannya
# di cabang `preview-build` agar bisa diperiksa sebelum digabung ke main.
# Tidak menerbitkan apa pun ke GitHub Pages.
on:
  push:
    branches-ignore: [main, preview-build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, gd, intl
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader
      - name: Run tests
        env:
          APP_ENV: testing
          APP_URL: http://localhost
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan test > test-output.txt 2>&1 || echo "TESTS FAILED" >> test-output.txt; tail -20 test-output.txt
      - name: Export static preview
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_URL: https://salfar256.github.io/ibnu-aqil-education-centre
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: |
          touch database/database.sqlite
          php artisan migrate --seed --force
          php artisan app:export-public --url="$APP_URL" --output=pages
          cp test-output.txt pages/_test-output.txt
      - name: Save preview to preview-build branch
        run: |
          cd pages
          git init -q -b preview-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview ${GITHUB_SHA::7} dari ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" preview-build
